version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "5 0 16 * *"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 15
    assignees:
      - Voodoo2man
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "5 0 16 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - Voodoo2man
